# Coolify deployment based on ProjectSend's official production example.
# Bootstrap credentials are supplied in Coolify, never stored in this repository.
services:
  app:
    image: projectsend/projectsend:2
    restart: unless-stopped
    environment:
      SERVICE_URL_APP_80: /
      APP_URL: ${APP_URL:?Set the public HTTPS URL}
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: projectsend
      DB_USERNAME: projectsend
      DB_PASSWORD: ${SERVICE_PASSWORD_PROJECTSENDDB}
      REDIS_HOST: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      TRUSTED_PROXIES: "*"
      ADMIN_NAME: Administrator
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set the administrator email before deployment}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set the administrator password before deployment}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: projectsend
      MYSQL_USER: projectsend
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_PROJECTSENDDB}
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_PROJECTSENDROOT}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  storage:
  db-data:
  redis-data:
